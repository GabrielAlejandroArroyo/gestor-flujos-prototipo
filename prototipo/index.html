<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#1a2332" />
  <title>Gestor de flujos de trabajo — Prototipo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="js/theme-init.js"></script>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="header-start">
        <button type="button" class="menu-toggle" id="menu-toggle" aria-label="Cerrar menú" aria-expanded="true" aria-controls="nav-drawer">
          <span></span><span></span><span></span>
        </button>
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <div>
            <h1>Gestor de flujos</h1>
            <p class="subtitle">Prototipo · diseño y ejecución de flujos</p>
          </div>
        </div>
      </div>
      <div class="header-actions">
        <div id="auth-header-slot" class="auth-header-slot" hidden></div>
        <button type="button" class="btn btn-ghost btn-sm" id="btn-ai-config" title="Configuración IA">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px;color:var(--accent)"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        </button>
        <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Activar modo claro"></button>
      </div>
    </header>

    <div class="app-shell" id="app-shell">
      <div class="nav-overlay" id="nav-overlay" aria-hidden="true"></div>
      <aside class="nav-drawer is-open" id="nav-drawer" aria-label="Menú principal" aria-hidden="false">
        <p class="nav-drawer-title">Trabajo</p>
        <div class="nav-group" data-nav-group="designer">
          <button type="button" class="nav-btn nav-group-toggle is-active" data-view="designer" data-catalog="flows" aria-expanded="true">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4zM8 9h8M8 13h5" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg>
            Diseñador de flujo
          </button>
          <div class="nav-sub" id="nav-designer-sub">
            <button type="button" class="nav-btn nav-sub-btn is-active" data-view="designer" data-catalog="flows">Catálogo de flujos</button>
            <button type="button" class="nav-btn nav-sub-btn" data-view="designer" data-catalog="activities">Catálogo de actividades</button>
          </div>
        </div>
        <p class="nav-drawer-title">Maestros</p>
        <div class="nav-group" data-nav-group="maestros">
          <button type="button" class="nav-btn nav-group-toggle" data-view="maestros" data-master="flowTypes" aria-expanded="true">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v12H4V6zm2 2v2h12V8H6zm0 4v2h8v-2H6z" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/></svg>
            Maestros
          </button>
          <div class="nav-sub" id="nav-maestros-sub">
            <button type="button" class="nav-btn nav-sub-btn" data-view="maestros" data-master="flowTypes">Tipo de flujo</button>
            <div class="nav-sub-group" data-maestros-section="entityDefinitions">
              <p class="nav-sub-group-label">Definiciones de entidad</p>
              <button type="button" class="nav-btn nav-sub-btn nav-sub-btn--nested" data-view="maestros" data-master="entities">Entidades</button>
            </div>
            <div class="nav-sub-group" data-maestros-section="masterDefinitions">
              <p class="nav-sub-group-label">Definición de maestros</p>
              <button type="button" class="nav-btn nav-sub-btn nav-sub-btn--nested" data-view="maestros" data-master="masterDefinitions">Definición de maestros</button>
            </div>
            <div class="nav-sub-group" data-maestros-section="masterRecordsAbm">
              <p class="nav-sub-group-label">ABM maestros</p>
              <button type="button" class="nav-btn nav-sub-btn nav-sub-btn--nested" data-view="maestros" data-master="masterRecords">Resumen ABM maestros</button>
              <div id="nav-master-records-abm-items" class="nav-master-records-abm-items" aria-live="polite"></div>
            </div>
          </div>
        </div>
        <p class="nav-drawer-title">Operaciones</p>
        <div class="nav-group" data-nav-group="operaciones">
          <button type="button" class="nav-btn nav-group-toggle" data-view="gestion" aria-expanded="true">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11l2 2 4-4M7 4h10a2 2 0 012 2v14l-4-2-4 2-4-2-4 2V6a2 2 0 012-2z" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/></svg>
            Operaciones
          </button>
          <div class="nav-sub" id="nav-operaciones-sub">
            <button type="button" class="nav-btn nav-sub-btn" data-view="gestion">Gestión de actividades</button>
            <button type="button" class="nav-btn nav-sub-btn" data-view="auth-users">Usuarios</button>
            <button type="button" class="nav-btn nav-sub-btn" data-view="user-profile">Mi perfil</button>
            <button type="button" class="nav-btn nav-sub-btn" data-view="data-backup">Datos (local ↔ Pages)</button>
          </div>
        </div>
        <p class="nav-drawer-title">Reportes</p>
        <div class="nav-group" data-nav-group="reportes">
          <button type="button" class="nav-btn nav-group-toggle" data-view="report-activities" aria-expanded="true">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5h16v14H4zm2-2h5v-4H6v4zm7 0h5v-7h-5v7zm-7-6h5V7H6v4z" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/></svg>
            Reportes
          </button>
          <div class="nav-sub" id="nav-reportes-sub">
            <button type="button" class="nav-btn nav-sub-btn" data-view="report-activities">Actividades (ejecución)</button>
            <button type="button" class="nav-btn nav-sub-btn" data-view="report-maestros-changes">Cambios en maestros</button>
            <button type="button" class="nav-btn nav-sub-btn" data-view="report-entities-changes">Cambios de entidades</button>
            <button type="button" class="nav-btn nav-sub-btn" data-view="report-flows">Catálogo de flujos</button>
            <button type="button" class="nav-btn nav-sub-btn" data-view="report-flow-types">Tipos de flujo</button>
            <button type="button" class="nav-btn nav-sub-btn" data-view="report-entities">Entidades</button>
            <button type="button" class="nav-btn nav-sub-btn" data-view="report-activities-catalog">Catálogo de actividades</button>
          </div>
        </div>
        <div class="nav-drawer-footer">
          <a href="documentacion.html">Documentación</a>
          <a href="bitacora.html">Bitácora</a>
          <a href="versiones.html">Índice de versiones</a>
        </div>
      </aside>
      <main id="app-main" class="app-main"></main>
    </div>

    <footer class="app-footer">
      <a href="documentacion.html">Documentación</a>
      ·
      <a href="bitacora.html">Bitácora</a>
      ·
      <a href="versiones.html">Versiones</a>
    </footer>
  </div>

  <div id="modal-root" class="modal-root" hidden></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <!-- Tras cambiar archivos en js/, ejecutá: powershell -File prototipo/build-mock.ps1 -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" crossorigin="anonymous"></script>
  <script src="js/bundle.js?v=gestion-tabs-1" defer></script>
</body>
</html>
