# Gestor App — stack listo para integración
# Uso: cp .env.example .env  →  editar Supabase  →  docker compose up -d --build
# UI: http://localhost:3000  |  Integración: http://localhost:3000/integracion

name: gestor-flujos

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    image: gestor-flujos-app:latest
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3000}
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  # Carga inicial del dataset testing (requiere Supabase configurado en .env)
  seed:
    profiles: ["seed"]
    image: node:22-alpine
    working_dir: /work
    volumes:
      - ..:/repo:ro
    env_file:
      - path: .env
        required: true
    command: ["node", "/repo/gestor-app/scripts/import-mock-to-supabase.mjs"]
    depends_on:
      app:
        condition: service_healthy
